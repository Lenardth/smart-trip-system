trigger:
  branches:
    include:
      - main
      - master
      - develop

pr:
  branches:
    include:
      - main
      - master
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  phpVersion: '8.4'
  nodeVersion: '18.x'

steps:
  - checkout: self

  - task: UsePhpVersion@0
    inputs:
      versionSpec: '$(phpVersion)'

  - task: NodeTool@0
    inputs:
      versionSpec: '$(nodeVersion)'

  - script: composer install --no-interaction --prefer-dist --optimize-autoloader
    displayName: 'Install PHP dependencies'

  - script: npm ci --prefer-offline
    displayName: 'Install Node dependencies'

  - script: |
      cp .env.example .env || true
      mkdir -p database
      touch database/database.sqlite
      php artisan key:generate
      php artisan config:clear
      php artisan cache:clear
      chmod -R 777 storage bootstrap/cache
    displayName: 'Prepare Laravel app'

  - script: php artisan migrate --force
    displayName: 'Run migrations'

  - script: php artisan test
    displayName: 'Run test suite'

  - script: npm run build
    displayName: 'Build frontend assets'
