name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '18'

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, gd, zip, redis
          coverage: xdebug
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite
          chmod 777 database/database.sqlite

      - name: Create .env file (Method 1 - Copy from example)
        run: |
          if [ -f .env.example ]; then
            cp -v .env.example .env
            echo "✓ Copied .env.example to .env"
          fi
        continue-on-error: true

      - name: Create .env file (Method 2 - Direct write)
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f .env ]; then
            echo "APP_NAME=Laravel" > .env
            echo "APP_ENV=testing" >> .env
            echo "APP_KEY=" >> .env
            echo "APP_DEBUG=true" >> .env
            echo "APP_URL=http://localhost" >> .env
            echo "LOG_CHANNEL=stack" >> .env
            echo "LOG_LEVEL=debug" >> .env
            echo "DB_CONNECTION=sqlite" >> .env
            echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite" >> .env
            echo "BROADCAST_DRIVER=log" >> .env
            echo "CACHE_STORE=array" >> .env
            echo "FILESYSTEM_DISK=local" >> .env
            echo "QUEUE_CONNECTION=sync" >> .env
            echo "SESSION_DRIVER=array" >> .env
            echo "REDIS_HOST=127.0.0.1" >> .env
            echo "REDIS_PORT=6379" >> .env
            echo "MAIL_MAILER=log" >> .env
            echo "MAIL_FROM_ADDRESS=test@example.com" >> .env
            echo "MAIL_FROM_NAME=Laravel" >> .env
            echo "✓ Created .env file from scratch"
          fi

      - name: Verify .env exists
        run: |
          pwd
          ls -lah .env || echo "ERROR: .env file NOT found!"
          echo "=== .env contents ==="
          cat .env || echo "ERROR: Cannot read .env!"
          echo "====================="

      - name: Generate application key
        run: php artisan key:generate -v

      - name: Set directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run database migrations
        run: php artisan migrate:fresh --seed --force

      - name: Build frontend assets
        run: npm run build

      - name: Run PHPUnit tests
        run: php artisan test --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G
        continue-on-error: true
